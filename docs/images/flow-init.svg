<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 594" width="100%" font-family='-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif'>
  <title>启动与连接流程</title>
  <desc>程序启动到进入扫描循环的关键调用顺序。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="32" font-size="16" font-weight="500" fill="#2C2C2A">启动与连接流程</text>
  <rect x="90" y="56" width="500" height="58" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <circle cx="116" cy="85.0" r="13" fill="#185FA5"/>
  <text x="116" y="85.0" font-size="12" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="140" y="76.0" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">main() 启动</text>
  <text x="140" y="96.0" font-size="11" fill="#5F5E5A" dominant-baseline="central">QApplication + 单实例互斥检查</text>
  <line x1="340.0" y1="114" x2="340.0" y2="144" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="90" y="144" width="500" height="58" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <circle cx="116" cy="173.0" r="13" fill="#0F6E56"/>
  <text x="116" y="173.0" font-size="12" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="140" y="164.0" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">构造 motor_gui</text>
  <text x="140" y="184.0" font-size="11" fill="#5F5E5A" dominant-baseline="central">初始化图标、加载配置、无边框窗口</text>
  <line x1="340.0" y1="202" x2="340.0" y2="232" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="90" y="232" width="500" height="58" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <circle cx="116" cy="261.0" r="13" fill="#534AB7"/>
  <text x="116" y="261.0" font-size="12" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="140" y="252.0" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">strat_connect()</text>
  <text x="140" y="272.0" font-size="11" fill="#5F5E5A" dominant-baseline="central">启动连接与扫描入口</text>
  <line x1="340.0" y1="290" x2="340.0" y2="320" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="90" y="320" width="500" height="58" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <circle cx="116" cy="349.0" r="13" fill="#5F5E5A"/>
  <text x="116" y="349.0" font-size="12" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="140" y="340.0" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">initial_modbus_connection()</text>
  <text x="140" y="360.0" font-size="11" fill="#5F5E5A" dominant-baseline="central">串口 9600-8-N-1，下发读归零状态帧</text>
  <line x1="340.0" y1="378" x2="340.0" y2="408" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="90" y="408" width="500" height="58" rx="8" fill="#FCE7EF" stroke="#EC9BC0" stroke-width="0.5"/>
  <circle cx="116" cy="437.0" r="13" fill="#9C3D68"/>
  <text x="116" y="437.0" font-size="12" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="140" y="428.0" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">启动定时器与线程</text>
  <text x="140" y="448.0" font-size="11" fill="#5F5E5A" dominant-baseline="central">40ms 接收轮询 + 进度条线程</text>
  <line x1="340.0" y1="466" x2="340.0" y2="496" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="90" y="496" width="500" height="58" rx="8" fill="#FAEEDA" stroke="#E8B562" stroke-width="0.5"/>
  <circle cx="116" cy="525.0" r="13" fill="#854F0B"/>
  <text x="116" y="525.0" font-size="12" fill="#ffffff" text-anchor="middle" dominant-baseline="central">6</text>
  <text x="140" y="516.0" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">进入 scan()</text>
  <text x="140" y="536.0" font-size="11" fill="#5F5E5A" dominant-baseline="central">归零后开始四方位扫描</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 516" width="100%" font-family='-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif'>
  <title>Modbus RTU 通信原理</title>
  <desc>从控制参数到 Modbus 帧，再到应答解析与联机分发的完整链路。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="32" font-size="16" font-weight="500" fill="#2C2C2A">Modbus RTU 通信原理</text>
  <rect x="40" y="56" width="170" height="62" rx="8" fill="#ffffff" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="125" y="87.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">上位机参数</text>
  <line x1="210" y1="87.0" x2="258" y2="87.0" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="262" y="56" width="156" height="62" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="340" y="87.0" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">32 位位置拆分</text>
  <line x1="418" y1="87.0" x2="466" y2="87.0" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="470" y="56" width="170" height="62" rx="8" fill="#ffffff" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="555" y="87.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">位置寄存器帧</text>
  <rect x="40" y="140" width="170" height="62" rx="8" fill="#ffffff" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="125" y="171.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">6 字节指令</text>
  <line x1="210" y1="171.0" x2="258" y2="171.0" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="262" y="140" width="156" height="62" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="340" y="171.0" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">MODBUS CRC16</text>
  <line x1="418" y1="171.0" x2="466" y2="171.0" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="470" y="140" width="170" height="62" rx="8" fill="#ffffff" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="555" y="171.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">8 字节 RTU 帧</text>
  <rect x="40" y="224" width="170" height="62" rx="8" fill="#ffffff" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="125" y="255.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">QSerialPort</text>
  <line x1="210" y1="255.0" x2="258" y2="255.0" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="262" y="224" width="156" height="62" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="340" y="255.0" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">RS-485 串口</text>
  <line x1="418" y1="255.0" x2="466" y2="255.0" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="470" y="224" width="170" height="62" rx="8" fill="#ffffff" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="555" y="255.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">伺服驱动器</text>
  <rect x="40" y="308" width="170" height="62" rx="8" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="125" y="339.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">响应帧 01 03</text>
  <line x1="210" y1="339.0" x2="258" y2="339.0" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="262" y="308" width="156" height="62" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="339.0" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">故障码映射表</text>
  <line x1="418" y1="339.0" x2="466" y2="339.0" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="470" y="308" width="170" height="62" rx="8" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="555" y="339.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">日志 / 界面告警</text>
  <rect x="40" y="392" width="170" height="62" rx="8" fill="#ffffff" stroke="#EC9BC0" stroke-width="0.5"/>
  <text x="125" y="423.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">方位角度</text>
  <line x1="210" y1="423.0" x2="258" y2="423.0" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="262" y="392" width="156" height="62" rx="8" fill="#FCE7EF" stroke="#EC9BC0" stroke-width="0.5"/>
  <text x="340" y="423.0" font-size="11" fill="#9C3D68" text-anchor="middle" dominant-baseline="central">事件 + INI</text>
  <line x1="418" y1="423.0" x2="466" y2="423.0" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="470" y="392" width="170" height="62" rx="8" fill="#ffffff" stroke="#EC9BC0" stroke-width="0.5"/>
  <text x="555" y="423.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">测风采集软件</text>
  <text x="40" y="484" font-size="11" fill="#5F5E5A">CRC 初值 0xFFFF、多项式 0xA001；一圈 2^24 脉冲，单步 32768 脉冲。</text>
</svg>